<div class="scanner-overlay" (click)="close()">

  <div
    class="scanner-card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="scanner-title"
    (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="scanner-header">

      <div>
        <h2 id="scanner-title">Scan barcode</h2>
        <p>Point your camera at the product barcode.</p>
      </div>

      <button type="button" class="close-btn" (click)="close()" aria-label="Close">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M6 6l12 12M18 6 6 18"/>
        </svg>
      </button>

    </div>


    <!-- Camera -->
    <div class="scanner-stage">

      <!-- html5-qrcode puts the live video in here -->
      <div id="barcode-scanner-reader" class="scanner-reader"></div>

      <!-- Viewfinder -->
      <div class="viewfinder" *ngIf="!hasError" [class.success]="isSuccess">

        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>

        <span class="laser" *ngIf="!isStarting && !isSuccess"></span>

        <span class="tick" *ngIf="isSuccess">
          <svg viewBox="0 0 24 24">
            <path d="m5 12.5 4.5 4.5L19 7.5"/>
          </svg>
        </span>

      </div>

      <!-- Starting -->
      <div class="stage-status" *ngIf="isStarting && !hasError">
        <span class="spinner"></span>
        Starting camera...
      </div>

      <!-- Flashlight -->
      <button
        type="button"
        class="torch-btn"
        *ngIf="torchSupported && !hasError"
        [class.on]="torchOn"
        (click)="toggleTorch()"
        [attr.aria-pressed]="torchOn"
        aria-label="Toggle flashlight">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M13 2 4 14h7l-1 8 9-12h-7z"/>
        </svg>
      </button>

      <!-- Error -->
      <div class="stage-error" *ngIf="hasError">

        <div class="error-icon">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <path d="m3 3 18 18"/>
          </svg>
        </div>

        <h3>Camera unavailable</h3>
        <p>{{ errorMessage }}</p>

        <button type="button" class="btn btn-light" (click)="startScanner()">
          Try again
        </button>

      </div>

    </div>


    <!-- Hint -->
    <div class="scanner-hint" [class.success]="isSuccess" *ngIf="!hasError">
      <ng-container *ngIf="!isSuccess; else found">
        Keep the barcode inside the frame and hold steady.
      </ng-container>
      <ng-template #found>Barcode found</ng-template>
    </div>


    <!-- Manual entry -->
    <div class="manual">

      <label for="manual-barcode">Or type the barcode</label>

      <div class="manual-row">
        <input
          #manual
          id="manual-barcode"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          placeholder="e.g. 8901234567890"
          (keydown.enter)="submitManual(manual.value)"
        />

        <button type="button" class="btn btn-primary" (click)="submitManual(manual.value)">
          Use code
        </button>
      </div>

    </div>


    <!-- Footer -->
    <div class="scanner-footer">
      <button type="button" class="btn btn-ghost" (click)="close()">
        Cancel
      </button>
    </div>

  </div>

</div>
